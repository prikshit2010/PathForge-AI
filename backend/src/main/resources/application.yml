spring:
  application:
    name: pathforge-ai
  profiles:
    active: mysql

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:pathforgedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pathforgedb?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:2010G@ut}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

ai:
  provider:
    api-key: ${AI_API_KEY:AQ.Ab8RN6LpQ8_aSzmb4kdyLaoKPOQD8jJb9HyM_YxQDp1OT6R65w}
    url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}
    model: ${AI_MODEL:gemini-3.8-flash}
